name: Custom Package (Windows, Ubuntu, Mac MINI)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

env:
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VERSION: "1.5.1"

jobs:
  # 1. 產生 flutter-rust-bridge 程式碼
  generate-bridge:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Cache cargo tools
        id: cache-cargo-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: cargo-bridge-tools-${{ env.CARGO_EXPAND_VERSION }}-${{ env.FLUTTER_RUST_BRIDGE_VERSION }}

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          if [ "${{ steps.cache-cargo-tools.outputs.cache-hit }}" != "true" ]; then
            cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
            cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          fi
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        shell: bash
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  # 2. Windows 輔助元件
  build-topmost-window:
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Clone and build WindowInjection
        shell: powershell
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
          cd RustDeskTempTopMostWindow
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild WindowInjection\WindowInjection.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion=Windows10

      - name: Upload TopMostWindow artifact
        uses: actions/upload-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll

  # 3. 打包 Windows 版本 (.exe)
  build-windows:
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Restore TopMostWindow
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: ./temp-topmost

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        shell: powershell
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engineDirs = Get-ChildItem -Path "C:\hostedtoolcache\windows\flutter" -Recurse -Directory -Filter "windows-x64-release" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          if (-not $engineDirs) {
            $flutterPath = (Get-Command flutter).Source
            $flutterBin = Split-Path (Split-Path $flutterPath)
            $engineDirs = @("$flutterBin\cache\artifacts\engine\windows-x64-release")
          }
          foreach ($dir in $engineDirs) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Copy-Item windows-x64-release\* $dir -Force -Recurse
          }

      - name: Patch flutter
        shell: bash
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed" --triplet=x64-windows-static

      - name: Build Windows App
        shell: bash
        run: |
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram

      - name: Package Windows portable & setup
        shell: powershell
        run: |
          if (Test-Path "temp-topmost\WindowInjection.dll") {
            Copy-Item "temp-topmost\WindowInjection.dll" "flutter\build\windows\x64\runner\Release\WindowInjection.dll" -Force
          }
          pip3 install brotli
          pushd libs\portable
          pip3 install -r requirements.txt
          python3 .\generate.py -f ..\..\flutter\build\windows\x64\runner\Release -o . -e ..\..\flutter\build\windows\x64\runner\Release\rustdesk.exe
          popd
          New-Item -ItemType Directory -Force -Path output
          if (Test-Path "target\release\rustdesk-portable-packer.exe") {
            Copy-Item target\release\rustdesk-portable-packer.exe output\rustdesk-${{ env.VERSION }}-x86_64.exe -Force
          } elseif (Test-Path "libs\portable\target\release\rustdesk-portable-packer.exe") {
            Copy-Item libs\portable\target\release\rustdesk-portable-packer.exe output\rustdesk-${{ env.VERSION }}-x86_64.exe -Force
          }

      - name: Upload Windows Output
        uses: actions/upload-artifact@v4
        with:
          name: windows-output
          path: output/*

  # 4. 打包 Ubuntu 版本 (.deb)
  build-ubuntu:
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config wget libxdo-dev libayatana-appindicator3-dev libva-dev libvdpau-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpam0g-dev

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed" --triplet=x64-linux

      - name: Build Ubuntu deb package
        run: |
          python3 ./build.py --flutter --hwcodec --unix-file-copy-paste

      - name: Collect Ubuntu Deb
        run: |
          mkdir -p output
          cp rustdesk-*.deb output/

      - name: Upload Ubuntu Output
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-output
          path: output/*

  # 5. 打包 Mac MINI 版本 (.dmg, Apple Silicon ARM64)
  build-macmini:
    needs: [generate-bridge]
    runs-on: macos-14
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install build runtime & create-dmg
        run: |
          brew install llvm create-dmg pkg-config wget

      - name: Install NASM
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - name: Workaround for flutter issue
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed" --triplet=arm64-osx

      - name: Build Mac MINI App
        run: |
          chmod +x build.py
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          python3 ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

      - name: Create DMG for Mac MINI
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 rustdesk-${{ env.VERSION }}-aarch64.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app
          mkdir -p output
          cp rustdesk-*.dmg output/

      - name: Upload Mac MINI Output
        uses: actions/upload-artifact@v4
        with:
          name: macmini-output
          path: output/*

  # 6. 整合所有產出至單一 OUT 套件
  package-all-out:
    needs: [build-windows, build-ubuntu, build-macmini]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-output
          path: OUT/

      - name: Download Ubuntu Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-output
          path: OUT/

      - name: Download Mac MINI Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macmini-output
          path: OUT/

      - name: Upload Combined OUT Package
        uses: actions/upload-artifact@v4
        with:
          name: OUT
          path: OUT/*
